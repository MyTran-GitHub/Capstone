# LiteLLM proxy configuration
# Enables Anthropic Claude 3.5 Haiku for all clients via an OpenAI-compatible endpoint
# Notes:
# - "Claude Haiku 4.5" likely refers to Anthropic's Claude 3.5 Haiku. If you truly need a different
#   version string, update `litellm_params.model` accordingly.

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      # OpenAI model identifier (direct OpenAI API)
      model: openai/gpt-4o-mini
      # The OpenAI API key is read from the OPENAI_API_KEY environment variable
      # Do not hardcode secrets in this file.
  - model_name: claude-3-5-haiku
    litellm_params:
      # Anthropic model identifier (direct Anthropic API)
      model: anthropic/claude-3-5-haiku-latest
      # The Anthropic API key is read from the ANTHROPIC_API_KEY environment variable
      # Do not hardcode secrets in this file.

# Optional: alias to make `haiku` also resolve to the same model name
router_settings:
  - alias: haiku
    model_name: claude-3-5-haiku
  - alias: gpt-mini
    model_name: gpt-4o-mini

# Set a default model so clients that omit `model` still route to Haiku
general_settings:
  default_model: gpt-4o-mini
  # Limit allowed models to approved list for now (tightens policy surface)
  allowed_models:
    - gpt-4o-mini
    - claude-3-5-haiku

# Logging for observability
logging:
  level: INFO
